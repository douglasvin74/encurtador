# Load balancer da fase 8.
#
# Igual ao da fase 7, com uma diferenca que resume a fase: os upstreams deixaram
# de ser portas em 127.0.0.1 e viraram NOMES DE SERVICO. Dentro da rede do
# compose, "encurtador-a" resolve para o IP do container - o DNS e do proprio
# Docker. Ninguem precisa saber IP de ninguem, e escalar deixa de significar
# escolher portas livres na maquina.
#
#   docker compose up --build
#   docker compose down

worker_processes 1;

# No container o Nginx roda como root e o /run e dele: o pid volta para o
# lugar padrao, e o log vai para a saida padrao, que e onde o Docker procura.
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;

    # As copias identicas do lado da escrita.
    #
    # Round-robin e o padrao: requisicao 1 vai para a primeira, 2 para a
    # segunda, 3 volta para a primeira. So funciona porque as instancias sao
    # intercambiaveis - se o link vivesse dentro de uma delas, metade dos
    # cliques daria 404. Foi para isso que o estado foi para o Postgres.
    #
    # max_fails/fail_timeout e health check PASSIVO: o Nginx nao pergunta nada,
    # ele repara que a instancia falhou atendendo trafego real e a tira da
    # rotacao por 10s. Checagem ATIVA (bater em /health de tempos em tempos) so
    # existe no Nginx Plus; no aberto, /health serve para o teste e para quem
    # estiver olhando - e, nesta fase, para o healthcheck do compose, que e quem
    # segura o nginx no ar ate as instancias estarem prontas.
    upstream encurtadores {
        server encurtador-a:8080 max_fails=2 fail_timeout=10s;
        server encurtador-b:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://encurtadores;

            # Sem isso a instancia so enxerga 127.0.0.1 (o proprio Nginx) e o
            # Host vira o nome do upstream.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Instancia caiu no meio da requisicao: tenta a proxima em vez de
            # devolver 502. Vale porque POST /encurtar e idempotente (mesma URL,
            # mesmo codigo, fase 2) - sem isso, non_idempotent seria arriscado.
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_connect_timeout 2s;

            # O redirect (302) tem que chegar cru no navegador, sem o Nginx
            # reescrever o Location para o destino final.
            proxy_redirect off;
        }
    }
}
